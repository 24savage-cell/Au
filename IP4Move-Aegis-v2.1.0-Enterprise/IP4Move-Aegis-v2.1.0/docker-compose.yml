# IP4Move-Aegis v2.1.0 企业版 Docker Compose
# 生产环境部署配置

version: '3.8'

services:
  # ============================================================================
  # 主服务
  # ============================================================================
  aegis:
    build:
      context: .
      dockerfile: Dockerfile
    image: ip4move-aegis:2.1.0
    container_name: ip4move-aegis
    restart: unless-stopped
    
    # 端口映射
    ports:
      - "8080:8080"    # API端口
      - "9050:9050"    # DHT端口
    
    # 环境变量
    environment:
      - IP4MOVE_ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      - LOG_LEVEL=INFO
      - JSON_LOGS=true
      # 密钥 (生产环境必须设置)
      # - AEGIS_MASTER_SECRET=${AEGIS_MASTER_SECRET}
    
    # 密钥文件
    env_file:
      - .env
    
    # 数据卷
    volumes:
      - aegis-data:/app/data
      - aegis-logs:/app/logs
      - aegis-config:/app/config
      - ./.env:/app/.env:ro
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # 网络
    networks:
      - aegis-network
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service_name,environment"

  # ============================================================================
  # Redis缓存 (可选)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ip4move-redis
    restart: unless-stopped
    
    # 端口 (仅内部访问)
    expose:
      - "6379"
    
    # 数据卷
    volumes:
      - redis-data:/data
    
    # 配置
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    
    # 健康检查
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    
    networks:
      - aegis-network

  # ============================================================================
  # Prometheus监控 (可选)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ip4move-prometheus
    restart: unless-stopped
    
    ports:
      - "9090:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    
    networks:
      - aegis-network

  # ============================================================================
  # Grafana可视化 (可选)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: ip4move-grafana
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    
    networks:
      - aegis-network

# ============================================================================
# 数据卷
# ============================================================================
volumes:
  aegis-data:
    driver: local
  aegis-logs:
    driver: local
  aegis-config:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ============================================================================
# 网络
# ============================================================================
networks:
  aegis-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
